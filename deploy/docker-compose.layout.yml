# Surcouche : active les partis de plan (variété des maisons générées).
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.layout.yml up -d ai
# Retour arrière : relancer sans cette surcouche (ou LAYOUT_VARIANTS=off). Voir docs/layout-variants.md.
services:
  ai:
    environment:
      LAYOUT_VARIANTS: ${LAYOUT_VARIANTS:-on}       # off | shadow | on
      LAYOUT_TOLERANCE: ${LAYOUT_TOLERANCE:-1.0}    # 0 = toujours le meilleur ; plus haut = plus de variété
