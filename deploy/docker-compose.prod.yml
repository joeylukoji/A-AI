# Preview client sur une seule instance (EC2). Ne pas confondre avec
# docker-compose.yml (dev local : ports DB/Redis/MinIO exposés, secrets publics).
#
# Prérequis : deploy/.env généré (voir gen-env.sh) + DNS A vers l'instance.
# Lancement : docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: aai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AAI_DOMAIN: ${AAI_DOMAIN:?set AAI_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-aai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-aai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-aai-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then echo "minio unreachable"; exit 1; fi
          sleep 2
        done
        mc mb -p "local/$$S3_BUCKET" || true
        exit 0
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      APP_ENV: production
      TRUST_PROXY_HEADERS: "1"
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      AI_BASE_URL: http://ai:8000
      QCAD_URL: ${QCAD_URL:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-aai-artifacts}
      S3_USE_PATH_STYLE: "1"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  ai:
    build:
      context: ../services/ai
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      API_CALLBACK_BASE: http://api:8080
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-aai-artifacts}
      AI_STUB: ${AI_STUB:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 8
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Blender n'est PAS déployé sur la preview EC2 (image trop lourde).
  # La génération 3D restera en file d'attente jusqu'à un worker dédié.

  qcad:
    profiles: ["dxf"]
    build:
      context: ..
      dockerfile: services/qcad/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      QCAD_BIN: /usr/bin/librecad
      QCAD_SCRIPT: /app/normalize_dxf.js
      QT_QPA_PLATFORM: offscreen
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
